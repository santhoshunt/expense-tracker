name: Release

on:
  push:
    tags: ['v*']

# The in-app updater installs whatever this workflow publishes, signed with
# the release key, so the key and the write token are kept away from code
# the build runs: actions are pinned to commits, the tests run before the
# key exists, the key is deleted right after the build, and only the
# publish job (which runs no project code) can write to the repo.
permissions:
  contents: read

# Runner pinned: ubuntu-latest moves to newer images on its own schedule,
# and a release build should change only when this file does.
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17' # AGP 9 needs JDK 17+; matches the local Zulu 21/17 setup
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      # The committed android/gradle.properties carries workarounds for the
      # dev machine (a Windows-only unix-socket tmpdir and tight heap caps).
      # User-home properties take precedence over project ones, so this
      # neutralizes them on the runner without touching the repo file.
      - name: Override machine-specific Gradle properties
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G
          kotlin.daemon.jvmargs=-Xmx2G
          EOF

      - run: flutter pub get
      - run: flutter test # never ship a red build; runs before the key exists

      - name: Restore release keystore
        run: printf '%s' "$KEYSTORE_B64" | base64 --decode > android/app/expense_tracker.jks
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      # storeFile is resolved by android/app/build.gradle.kts relative to
      # android/app/, where the keystore was just restored.
      - name: Write key.properties
        run: |
          cat > android/key.properties <<EOF
          storeFile=expense_tracker.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=expense_tracker
          EOF

      # One universal APK: the in-app updater downloads this single asset.
      - run: flutter build apk --release

      - name: Remove the release key
        if: always()
        run: rm -f android/app/expense_tracker.jks android/key.properties

      # The gradle script silently falls back to debug signing when
      # key.properties is unusable (e.g. a typo'd secret). Fail loudly instead
      # of publishing a debug-signed "release". APKs carry v2+ signatures that
      # keytool cannot read, so this must be apksigner. The certificate's
      # digest is pinned, not its name: the in-app updater installs only an
      # APK signed with the installed app's key, and this is that key.
      - name: Verify release signature
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | grep -q 'SHA-256 digest: bc3f14568ae909f50593f40cf3d84960372b1c3bbf8cd5176a864512b486e8d8'

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the release and upload assets
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: apk
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: app-release.apk
          generate_release_notes: true
