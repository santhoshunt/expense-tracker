# jdk.net.unixdomain.tmpdir works around Selector.open failing when the JDK's
# unix-domain socket pipe lands in the default user temp dir on this machine.
# 4G heap / 1G metaspace, down from the template's 8G/4G: this machine runs
# near its Windows commit limit, and the oversized daemon kept getting
# killed mid-build ("Gradle build daemon disappeared unexpectedly"). This
# app builds comfortably within 4G.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Djdk.net.unixdomain.tmpdir=D:/tmp
android.useAndroidX=true
# Kotlin incremental compilation breaks when the pub cache (C:) and project (D:)
# are on different drives; disable it.
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
